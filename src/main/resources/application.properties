server.port=0
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094

# consumer needs deserializers to be configured (from bytes[] to corresponding formats)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# unique consumer group id (for consumers to work in parallel while reading topics messages)
spring.kafka.consumer.group-id=product-created-events
# specifies which packages are trusted for JSON deserialization (safety config)
spring.kafka.consumer.properties.spring.json.trusted.packages=*
